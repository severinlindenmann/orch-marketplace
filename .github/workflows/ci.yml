name: ci
on:
  pull_request:
  push:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-ci.txt
      - name: Validator self-tests
        run: python -m pytest -q tests
      - name: Previous index (rollback floor)
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$base" ] && git cat-file -e "$base:marketplace.json" 2>/dev/null; then
            git show "$base:marketplace.json" > "$RUNNER_TEMP/previous.json"
          else
            echo "no previous index; skipping the rollback check"
          fi
      - name: Validate marketplace.json, fetch every entry at its pinned commit, compare digests
        run: |
          args=(--fetch)
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$base" ] && ! echo "$base" | grep -q '^0*$'; then args+=(--history-ref "$base"); fi
          [ -f "$RUNNER_TEMP/previous.json" ] && args+=(--previous "$RUNNER_TEMP/previous.json")
          python scripts/validate_index.py "${args[@]}" marketplace.json
