name: tests
# The unprivileged self-tests of the repository's own code (validator, schema, packages). They run the PR's code, so they
# are a quality check and NOT the gate: the gate is ci.yml, which validates the index with the BASE branch's validator.
on:
  pull_request:
  push:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-ci.txt
      - run: python -m pytest -q tests
